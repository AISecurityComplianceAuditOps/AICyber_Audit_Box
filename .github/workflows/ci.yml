name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint src/
        run: ruff check src/
        continue-on-error: true # report-only until the ruleset is tuned to this codebase

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: ruff-report.txt
          if-no-files-found: ignore

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # python-doctr requires opencv-python, the desktop build, unpinned; it
      # installs over the pinned opencv-python-headless (both are the `cv2`
      # package) and needs X11 / GL system libraries (libxcb.so.1) that a bare
      # machine lacks. `import cv2` then fails, the OCR pre-processing falls
      # back to the raw image, and test_ocr_preprocessing fails. The app image
      # installs those libraries; here, keep the headless build alone. Its
      # version is read from requirements.txt, so the pin stays in one place.
      - name: Install dependencies
        run: |
          pip install -r requirements.txt pytest
          pip uninstall -y opencv-python
          pip install --force-reinstall --no-deps $(grep -E '^opencv-python-headless==' requirements.txt)
          python -c "import cv2; print('cv2', cv2.__version__)"

      # tests/ mixes pytest files with runnable scripts that sys.exit at import.
      # tests/conftest.py excludes the scripts; without it `pytest` dies during
      # collection with INTERNALERROR: SystemExit and no test ever runs, which is
      # why this job did not exist and 29 test files sat unused while CI linted.
      #
      # Three further files need llama-server, the models and Postgres. They are
      # skipped here and included on a self-hosted runner by setting
      # AUDITBOX_STACK_TESTS=1.
      #
      # Baseline on 2026-09-06: 222 passed, 6 skipped, 0 failed in 27s.
      - name: Run tests
        run: python -m pytest --no-header

  review-gate-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Reminder
        run: |
          echo "Manual gate: run '/code-review' locally before merging this PR."
          echo "See qa/README.md for the full pipeline and how to re-run any single stage."
